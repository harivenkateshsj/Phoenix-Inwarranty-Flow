name: Postman Collection Workflow

on:
  push:
    branches:  [main]
  workflow_dispatch:
  schedule:
    -  cron: 30 02 * * * #8_am_IST_Everyday
    -  cron: 00 14 * * * #7_30_pm_IST_Everyday
    -  cron: 00 06 * * 1-5 #11_30_am_IST_MOnday_to_Friday

jobs:
  run-postman-tests:
    runs-on:  ubuntu-latest
    steps:
      - name: checkout the code
        uses: actions/checkout@v6.0.2

      - name: Install Nodejs and npm
        uses:  actions/setup-node@v6.4.0
        with:
          node-version: '22'

      - name:  Install Newman and Html-extra globally
        run:  |
            npm install -g newman
            npm install -g newman-reporter-htmlextra

      - name:  Run the postman collection with newman
        run:  |
             newman run 'Inwarranty-flow CollectionExternal.postman_collection.json' \
             -e QA.postman_environment.json \
             -d testdata.csv \
             -r cli,htmlextra

      - name:  Newman Report
        if:  always()
        uses:  actions/upload-artifact@v4
        with:
          name:  Newman Report
          path:  newman/*.html
      
