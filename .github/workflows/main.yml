name: Postman Collection Workflow

on:
  push:
    branches:  [main]
  workflow_dispatch:
  schedule:
    -  cron: 30 02 * * * #8_am_IST_Everyday
    -  cron: 00 14 * * * #7_30_pm_IST_Everyday
    -  cron: 00 06 * * 1-5 #11_30_am_IST_MOnday_to_Friday

jobs:
  run-postman-tests:
    runs-on:  ec2-github-runner
    steps:
      - name: checkout the code
        uses: actions/checkout@v6.0.2

      - name: Install Nodejs and npm
        uses:  actions/setup-node@v6.4.0
        with:
          node-version: '22'

      - name:  Install Newman and Html-extra globally
        run:  |
            npm install -g newman
            npm install -g newman-reporter-htmlextra

      - name:  Run the postman collection with newman
        run:  |
             newman run 'Inwarranty-flow collection Copy.postman_collection.json' \
             -e QA.postman_environment.json \
             -d testdata.csv \
             -r cli,htmlextra \
             --reporter-htmlextra-export ./newman/index.html

      - name:  Newman Report
        if:  always()
        uses:  actions/upload-artifact@v4
        with:
          name:  Newman Report
          path:  newman/*.html

      - name:  creating github page branch
        if:  always()
        uses:  peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token:  ${{ secrets.GITHUB_TOKEN }}
          publish_dir:  newman/

      - name:  Send Email Notification
        if:  always()
        uses:  dawidd6/action-send-mail@v17
        with:
          server_address:  smtp.gmail.com
          server_port:  465
          username:  ${{ secrets.EMAIL_USERNAME  }}
          password:  ${{  secrets.EMAIL_PASSWORD  }}
          subject:  Phoenix Inwarranty Flow Test Execution Notification
          to:  t4skrctsjhari@gmail.com
          from:  ${{ secrets.EMAIL_USERNAME  }}
          body:  |
                  Hi,
                  Phoenix Inwarranty flow tests has been executed
                  The Report has been published and the url is:
                  https://harivenkateshsj.github.io/Phoenix-Inwarranty-Flow/
                  
